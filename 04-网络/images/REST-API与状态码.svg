<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">REST API：URL 定位资源，方法决定动作，状态码报告结果</text>

  <text x="135" y="58" font-size="11" fill="#6b7280" text-anchor="middle">方法</text>
  <text x="330" y="58" font-size="11" fill="#6b7280" text-anchor="middle">资源（URL）</text>
  <text x="505" y="58" font-size="11" fill="#6b7280" text-anchor="middle">状态码</text>

  <!-- GET -->
  <rect x="90" y="84" width="90" height="32" rx="4" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="135" y="105" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">GET</text>
  <text x="330" y="105" text-anchor="middle"><tspan font-size="12" fill="#4b5563">/users</tspan><tspan font-size="11" fill="#6b7280" dx="8">（查所有用户）</tspan></text>
  <text x="505" y="105" font-size="12" fill="#047857" text-anchor="middle">200 OK</text>

  <!-- POST -->
  <rect x="90" y="134" width="90" height="32" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="135" y="155" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">POST</text>
  <text x="330" y="155" text-anchor="middle"><tspan font-size="12" fill="#4b5563">/users</tspan><tspan font-size="11" fill="#6b7280" dx="8">（新建用户）</tspan></text>
  <text x="505" y="155" font-size="12" fill="#047857" text-anchor="middle">201 Created</text>

  <!-- PUT -->
  <rect x="90" y="184" width="90" height="32" rx="4" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="135" y="205" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">PUT</text>
  <text x="330" y="205" text-anchor="middle"><tspan font-size="12" fill="#4b5563">/users/123</tspan><tspan font-size="11" fill="#6b7280" dx="8">（更新这个用户）</tspan></text>
  <text x="505" y="205" font-size="12" fill="#047857" text-anchor="middle">200 OK</text>

  <!-- DELETE -->
  <rect x="90" y="234" width="90" height="32" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="135" y="255" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">DELETE</text>
  <text x="330" y="255" text-anchor="middle"><tspan font-size="12" fill="#4b5563">/users/123</tspan><tspan font-size="11" fill="#6b7280" dx="8">（删除这个用户）</tspan></text>
  <text x="505" y="255" font-size="12" fill="#047857" text-anchor="middle">204 No Content</text>

  <text x="320" y="305" font-size="12" fill="#4b5563" text-anchor="middle">方法 = 动作，URL = 对象，状态码 = 结果</text>
</svg>
