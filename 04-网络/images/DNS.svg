<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">DNS：把好记的域名，翻译成机器用的 IP 地址</text>

  <rect x="250" y="58" width="140" height="44" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="86" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">example.com</text>
  <text x="320" y="118" font-size="11" fill="#6b7280" text-anchor="middle">（域名，人好记）</text>

  <line x1="320" y1="102" x2="320" y2="134" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="332" y="122" font-size="11" fill="#6b7280">查</text>

  <rect x="230" y="134" width="180" height="44" rx="6" fill="#8b5cf6"/>
  <text x="320" y="162" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">DNS 电话簿</text>

  <line x1="320" y1="178" x2="320" y2="210" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="332" y="198" font-size="11" fill="#6b7280">翻译出 IP</text>

  <rect x="250" y="210" width="140" height="44" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="238" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">93.184.216.34</text>
  <text x="320" y="274" font-size="11" fill="#6b7280" text-anchor="middle">（IP，机器用）</text>

  <text x="320" y="300" font-size="12" fill="#4b5563" text-anchor="middle">人记域名、机器用 IP，DNS 在中间做翻译</text>
</svg>
