<svg xmlns="http://www.w3.org/2000/svg" width="640" height="354" viewBox="0 0 640 354" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">延迟数字：把 1 纳秒放大成 1 秒，快慢才「看得见」</text>

  <text x="115" y="78" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">操作</text>
  <text x="340" y="78" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">真实延迟</text>
  <text x="520" y="78" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">若 1 ns = 1 秒</text>

  <!-- L1 缓存 -->
  <rect x="20" y="88" width="190" height="34" rx="5" fill="#c2410c"/>
  <text x="115" y="110" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">L1 缓存</text>
  <text x="340" y="110" font-size="12" fill="#4b5563" text-anchor="middle">~1 ns</text>
  <text x="520" y="110" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">约 1 秒</text>

  <!-- 主存 -->
  <rect x="20" y="134" width="190" height="34" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="115" y="156" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">主存（内存）</text>
  <text x="340" y="156" font-size="12" fill="#4b5563" text-anchor="middle">~100 ns</text>
  <text x="520" y="156" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">约 2 分钟</text>

  <!-- SSD -->
  <rect x="20" y="180" width="190" height="34" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="115" y="202" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">SSD 随机读</text>
  <text x="340" y="202" font-size="12" fill="#4b5563" text-anchor="middle">~100 μs</text>
  <text x="520" y="202" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">约 1 天</text>

  <!-- 磁盘 -->
  <rect x="20" y="226" width="190" height="34" rx="5" fill="#8b5cf6"/>
  <text x="115" y="248" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">机械盘寻道</text>
  <text x="340" y="248" font-size="12" fill="#4b5563" text-anchor="middle">~10 ms</text>
  <text x="520" y="248" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">约 4 个月</text>

  <!-- 跨洋网络 -->
  <rect x="20" y="272" width="190" height="34" rx="5" fill="#e07b00"/>
  <text x="115" y="294" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">跨洋网络往返</text>
  <text x="340" y="294" font-size="12" fill="#4b5563" text-anchor="middle">~150 ms</text>
  <text x="520" y="294" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">约 5 年</text>

  <text x="320" y="336" font-size="12" fill="#4b5563" text-anchor="middle">记住数量级、别记死值——数字会随硬件更新，快慢的「数量级差距」才是重点</text>
</svg>
