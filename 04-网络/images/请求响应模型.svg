<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" font-weight="bold" fill="#1d4ed8">请求-响应模型：客户端问一句，服务器答一句</text>

  <rect x="40" y="100" width="140" height="80" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="138" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">客户端</text>
  <text x="110" y="158" font-size="11" fill="#1d4ed8" text-anchor="middle">（浏览器 / App）</text>

  <rect x="460" y="100" width="140" height="80" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="530" y="138" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">服务器</text>
  <text x="530" y="158" font-size="11" fill="#047857" text-anchor="middle">（网站后端）</text>

  <line x1="180" y1="118" x2="452" y2="118" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="104" font-size="12" fill="#4b5563" text-anchor="middle">请求：方法 · URL · 头 · 体</text>

  <line x1="460" y1="162" x2="188" y2="162" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="184" font-size="12" fill="#4b5563" text-anchor="middle">响应：状态码 · 头 · 体</text>

  <text x="320" y="245" font-size="12" fill="#6b7280" text-anchor="middle">无状态：答完就忘，下次来是「新客人」</text>
  <text x="320" y="267" font-size="12" fill="#6b7280" text-anchor="middle">HTTPS = 给这一问一答加把锁（加密）</text>
</svg>
