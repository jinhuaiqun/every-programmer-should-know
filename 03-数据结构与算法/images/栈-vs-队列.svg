<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">栈：后进先出（LIFO） vs 队列：先进先出（FIFO）</text>

  <!-- 栈 -->
  <rect x="20" y="48" width="280" height="250" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="74" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">栈</text>
  <text x="160" y="98" font-size="11" fill="#1d4ed8" text-anchor="middle">栈顶（只在这一端进出）</text>

  <line x1="138" y1="112" x2="138" y2="174" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="146" font-size="11" fill="#e07b00" text-anchor="end">入栈</text>
  <line x1="182" y1="174" x2="182" y2="112" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="146" font-size="11" fill="#e07b00" text-anchor="start">出栈</text>

  <rect x="116" y="176" width="88" height="26" rx="4" fill="#3b82f6"/>
  <text x="160" y="194" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
  <rect x="116" y="206" width="88" height="26" rx="4" fill="#3b82f6"/>
  <text x="160" y="224" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
  <rect x="116" y="236" width="88" height="26" rx="4" fill="#3b82f6"/>
  <text x="160" y="254" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

  <text x="160" y="285" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">后进先出：C 最后进去，最先出去</text>

  <!-- 队列 -->
  <rect x="320" y="48" width="300" height="250" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="470" y="74" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">队列</text>

  <rect x="366" y="170" width="56" height="40" rx="4" fill="#10b981"/>
  <text x="394" y="195" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
  <rect x="442" y="170" width="56" height="40" rx="4" fill="#10b981"/>
  <text x="470" y="195" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
  <rect x="518" y="170" width="56" height="40" rx="4" fill="#10b981"/>
  <text x="546" y="195" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>

  <line x1="366" y1="190" x2="336" y2="190" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="351" y="214" font-size="11" fill="#e07b00" text-anchor="middle">出队</text>
  <line x1="606" y1="190" x2="576" y2="190" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="591" y="214" font-size="11" fill="#e07b00" text-anchor="middle">入队</text>

  <text x="394" y="232" font-size="11" fill="#047857" text-anchor="middle">队头</text>
  <text x="546" y="232" font-size="11" fill="#047857" text-anchor="middle">队尾</text>

  <text x="470" y="285" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">先进先出：A 先排进去，最先出去</text>

  <text x="20" y="322" font-size="12" fill="#6b7280">栈只从栈顶进出（push / pop），队列从队尾进、队头出（enqueue / dequeue）。</text>
</svg>
