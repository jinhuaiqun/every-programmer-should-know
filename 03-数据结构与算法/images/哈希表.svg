<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">哈希表：key 经哈希函数算出下标，直接定位到桶</text>

  <rect x="250" y="48" width="140" height="40" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="73" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">key：李四</text>

  <line x1="320" y1="88" x2="320" y2="112" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="112" width="180" height="44" rx="6" fill="#374151"/>
  <text x="320" y="139" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">哈希函数</text>

  <line x1="320" y1="156" x2="320" y2="180" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="172" font-size="11" fill="#6b7280">算出下标 2</text>

  <rect x="70" y="184" width="90" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="213" font-size="12" fill="#9ca3af" text-anchor="middle">空</text>

  <rect x="170" y="184" width="90" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="215" y="213" font-size="12" fill="#9ca3af" text-anchor="middle">空</text>

  <rect x="270" y="184" width="90" height="48" rx="6" fill="#10b981"/>
  <text x="315" y="204" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">李四 → 88</text>
  <text x="315" y="220" font-size="12" fill="#ecfdf5" text-anchor="middle">王五 → 73</text>

  <rect x="370" y="184" width="90" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="415" y="213" font-size="12" fill="#9ca3af" text-anchor="middle">空</text>

  <rect x="470" y="184" width="90" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="515" y="213" font-size="12" fill="#9ca3af" text-anchor="middle">空</text>

  <text x="115" y="248" font-size="11" fill="#6b7280" text-anchor="middle">下标 0</text>
  <text x="215" y="248" font-size="11" fill="#6b7280" text-anchor="middle">下标 1</text>
  <text x="315" y="248" font-size="11" fill="#6b7280" text-anchor="middle">下标 2</text>
  <text x="415" y="248" font-size="11" fill="#6b7280" text-anchor="middle">下标 3</text>
  <text x="515" y="248" font-size="11" fill="#6b7280" text-anchor="middle">下标 4</text>

  <text x="20" y="296" font-size="12" fill="#6b7280">冲突：「李四」「王五」都算到下标 2，就挂在同一个桶的小链表里（拉链法）。</text>
</svg>
