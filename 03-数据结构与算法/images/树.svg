<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">二叉搜索树：左子树全小、右子树全大</text>

  <line x1="320" y1="75" x2="185" y2="115" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="320" y1="75" x2="455" y2="115" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="185" y1="155" x2="115" y2="190" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="185" y1="155" x2="255" y2="190" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="455" y1="155" x2="525" y2="190" stroke="#3b82f6" stroke-width="1.5"/>

  <circle cx="320" cy="55" r="20" fill="#3b82f6"/>
  <text x="320" y="60" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <circle cx="185" cy="135" r="20" fill="#3b82f6"/>
  <text x="185" y="140" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="455" cy="135" r="20" fill="#3b82f6"/>
  <text x="455" y="140" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
  <circle cx="115" cy="210" r="20" fill="#3b82f6"/>
  <text x="115" y="215" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="255" cy="210" r="20" fill="#3b82f6"/>
  <text x="255" y="215" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <circle cx="525" cy="210" r="20" fill="#3b82f6"/>
  <text x="525" y="215" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">14</text>

  <text x="352" y="55" font-size="11" fill="#1d4ed8">根</text>

  <text x="320" y="272" font-size="12" fill="#6b7280" text-anchor="middle">左小右大：左子树全比根小、右子树全比根大；最下面没子节点的就是叶。</text>
</svg>
