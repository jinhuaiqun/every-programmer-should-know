<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">图：节点 + 边，谁和谁都能连</text>

  <line x1="180" y1="100" x2="400" y2="80" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="400" y1="80" x2="500" y2="190" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="500" y1="190" x2="380" y2="240" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="380" y1="240" x2="150" y2="210" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="150" y1="210" x2="180" y2="100" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="180" y1="100" x2="500" y2="190" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <circle cx="180" cy="100" r="20" fill="#8b5cf6"/>
  <text x="180" y="105" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
  <circle cx="400" cy="80" r="20" fill="#8b5cf6"/>
  <text x="400" y="85" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
  <circle cx="500" cy="190" r="20" fill="#8b5cf6"/>
  <text x="500" y="195" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
  <circle cx="380" cy="240" r="20" fill="#8b5cf6"/>
  <text x="380" y="245" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>
  <circle cx="150" cy="210" r="20" fill="#8b5cf6"/>
  <text x="150" y="215" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">E</text>

  <text x="290" y="74" font-size="11" fill="#6b7280" text-anchor="middle">边</text>
  <text x="124" y="210" font-size="11" fill="#6b7280" text-anchor="end">节点</text>

  <text x="320" y="282" font-size="12" fill="#6b7280" text-anchor="middle">节点随意相连、可以有环——遍历时要标记「访问过」，否则会转圈死循环。</text>
</svg>
