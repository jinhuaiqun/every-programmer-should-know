<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">大顶堆：父 ≥ 子，最大值永远在顶上</text>

  <line x1="320" y1="75" x2="185" y2="115" stroke="#10b981" stroke-width="1.5"/>
  <line x1="320" y1="75" x2="455" y2="115" stroke="#10b981" stroke-width="1.5"/>
  <line x1="185" y1="155" x2="130" y2="190" stroke="#10b981" stroke-width="1.5"/>
  <line x1="185" y1="155" x2="240" y2="190" stroke="#10b981" stroke-width="1.5"/>
  <line x1="455" y1="155" x2="400" y2="190" stroke="#10b981" stroke-width="1.5"/>

  <circle cx="320" cy="55" r="20" fill="#10b981"/>
  <text x="320" y="60" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
  <circle cx="185" cy="135" r="20" fill="#10b981"/>
  <text x="185" y="140" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <circle cx="455" cy="135" r="20" fill="#10b981"/>
  <text x="455" y="140" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <circle cx="130" cy="215" r="20" fill="#10b981"/>
  <text x="130" y="220" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="240" cy="215" r="20" fill="#10b981"/>
  <text x="240" y="220" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="400" cy="215" r="20" fill="#10b981"/>
  <text x="400" y="220" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <text x="352" y="55" font-size="11" fill="#047857">最大</text>

  <text x="320" y="272" font-size="12" fill="#6b7280" text-anchor="middle">父 ≥ 子：冠军总在最上面；但整体不一定有序，只保证顶部是极值。</text>
</svg>
