<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">索引 = 书的目录：查「张三」翻目录直达，而不是从头翻到尾</text>

  <!-- 目录（索引） -->
  <rect x="60" y="58" width="200" height="88" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="160" y="80" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">目录（索引）</text>
  <line x1="68" y1="88" x2="252" y2="88" stroke="#10b981" stroke-width="0.8"/>
  <text x="160" y="106" font-size="12" fill="#4b5563" text-anchor="middle">李四 → 1</text>
  <text x="160" y="124" font-size="12" font-weight="bold" fill="#e07b00" text-anchor="middle">张三 → 3</text>
  <text x="160" y="140" font-size="12" fill="#4b5563" text-anchor="middle">王五 → 5</text>

  <line x1="260" y1="124" x2="376" y2="124" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 正文（表数据） -->
  <rect x="380" y="58" width="200" height="88" rx="5" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="80" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">正文（表数据）</text>
  <line x1="388" y1="88" x2="572" y2="88" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="480" y="106" font-size="12" fill="#4b5563" text-anchor="middle">1 李四</text>
  <text x="480" y="124" font-size="12" font-weight="bold" fill="#e07b00" text-anchor="middle">3 张三</text>
  <text x="480" y="140" font-size="12" fill="#4b5563" text-anchor="middle">5 王五</text>

  <text x="320" y="176" font-size="12" fill="#4b5563" text-anchor="middle">有索引：翻目录直接定位（快）　没有索引：从头扫到尾（全表扫描，慢）</text>
  <text x="320" y="198" font-size="12" fill="#4b5563" text-anchor="middle">但目录本身要维护、还占空间——所以索引不是越多越好</text>
</svg>
