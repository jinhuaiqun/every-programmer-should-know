<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">静态 vs 动态：类型什么时候被检查？</text>

  <text x="55" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">静态</text>
  <text x="55" y="102" text-anchor="middle" font-size="11" fill="#6b7280">（编译期）</text>
  <rect x="130" y="60" width="220" height="48" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="142" y="89" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="#1d4ed8">int x = "hello";</text>
  <line x1="350" y1="84" x2="392" y2="84" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="392" y="60" width="200" height="48" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="492" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">✗ 编译期就报错</text>
  <text x="492" y="97" text-anchor="middle" font-size="11" fill="#b91c1c">（还没运行就拦下）</text>

  <text x="55" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b5cf6">动态</text>
  <text x="55" y="188" text-anchor="middle" font-size="11" fill="#6b7280">（运行期）</text>
  <rect x="130" y="146" width="220" height="48" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="142" y="175" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="#8b5cf6">x = 1  →  x + "a"</text>
  <line x1="350" y1="170" x2="392" y2="170" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="392" y="146" width="200" height="48" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="492" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">✗ 运行期才报错</text>
  <text x="492" y="183" text-anchor="middle" font-size="11" fill="#b91c1c">（跑到这一行才暴露）</text>

  <text x="20" y="222" font-size="12" fill="#6b7280">静态语言在编译期就发现类型错误；动态语言要运行到那一行才暴露。</text>
</svg>
