<svg xmlns="http://www.w3.org/2000/svg" width="540" height="300" viewBox="0 0 540 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">没有基准条件：递归停不下来，栈溢出</text>

  <rect x="20" y="64" width="180" height="100" rx="6" fill="#374151"/>
  <text x="34" y="90" font-size="13" fill="#ffffff">f(n) {</text>
  <text x="50" y="112" font-size="13" fill="#ffffff">return f(n+1);</text>
  <text x="34" y="134" font-size="12" fill="#9ca3af">} // 永远不停</text>

  <text x="375" y="262" text-anchor="middle" font-size="12" fill="#6b7280">栈空间（有限）</text>
  <rect x="290" y="64" width="170" height="180" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="310" y="216" width="130" height="24" rx="4" fill="#3b82f6"/>
  <text x="375" y="233" text-anchor="middle" font-size="12" fill="#ffffff">f(1)</text>
  <rect x="310" y="188" width="130" height="24" rx="4" fill="#3b82f6"/>
  <text x="375" y="205" text-anchor="middle" font-size="12" fill="#ffffff">f(2)</text>
  <rect x="310" y="160" width="130" height="24" rx="4" fill="#3b82f6"/>
  <text x="375" y="177" text-anchor="middle" font-size="12" fill="#ffffff">f(3)</text>
  <rect x="310" y="132" width="130" height="24" rx="4" fill="#3b82f6"/>
  <text x="375" y="149" text-anchor="middle" font-size="12" fill="#ffffff">f(4)</text>
  <rect x="310" y="104" width="130" height="24" rx="4" fill="#3b82f6"/>
  <text x="375" y="121" text-anchor="middle" font-size="12" fill="#ffffff">f(5)</text>
  <rect x="310" y="76" width="130" height="24" rx="4" fill="#3b82f6"/>
  <text x="375" y="93" text-anchor="middle" font-size="12" fill="#ffffff">f(6)</text>
  <rect x="310" y="48" width="130" height="24" rx="4" fill="#3b82f6"/>
  <text x="375" y="65" text-anchor="middle" font-size="12" fill="#ffffff">f(7)</text>
  <text x="375" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">栈溢出！</text>

  <text x="20" y="286" font-size="12" fill="#6b7280">加一个「基准条件」（如 f(1) 就返回）才能停下；否则栈帧无限增长，撑爆栈空间。</text>
</svg>
