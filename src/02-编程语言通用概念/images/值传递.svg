<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">值传递：复制一份值，改副本不动原件</text>

  <rect x="60" y="70" width="150" height="50" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="135" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">实参 x = 5</text>

  <line x1="210" y1="95" x2="256" y2="95" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="233" y="85" text-anchor="middle" font-size="11" fill="#e07b00">复制值</text>

  <rect x="260" y="70" width="180" height="50" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="350" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">形参 n = 5（副本）</text>

  <text x="60" y="158" font-size="12" fill="#6b7280">函数里把 n 改成 999，x 还是 5——改的是副本，原件不受影响。</text>
</svg>
