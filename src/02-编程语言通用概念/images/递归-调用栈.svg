<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">递归的执行：先「递」下去，再「归」回来</text>

  <text x="36" y="58" font-size="13" font-weight="bold" fill="#1d4ed8">递（往下调用，压栈）</text>
  <rect x="36" y="70" width="160" height="40" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="116" y="95" text-anchor="middle" font-size="13" fill="#1d4ed8">f(3)</text>
  <line x1="116" y1="110" x2="116" y2="128" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="128" y="123" font-size="11" fill="#e07b00">调用</text>
  <rect x="36" y="130" width="160" height="40" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="116" y="155" text-anchor="middle" font-size="13" fill="#1d4ed8">f(2)</text>
  <line x1="116" y1="170" x2="116" y2="188" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="128" y="183" font-size="11" fill="#e07b00">调用</text>
  <rect x="36" y="190" width="160" height="40" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="116" y="215" text-anchor="middle" font-size="13" fill="#1d4ed8">f(1)（基准）</text>

  <text x="424" y="58" font-size="13" font-weight="bold" fill="#047857">归（往上返回，出栈）</text>
  <rect x="424" y="70" width="180" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="514" y="95" text-anchor="middle" font-size="13" fill="#047857">f(3) = 6</text>
  <line x1="514" y1="130" x2="514" y2="112" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="526" y="125" font-size="11" fill="#e07b00">×3</text>
  <rect x="424" y="130" width="180" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="514" y="155" text-anchor="middle" font-size="13" fill="#047857">f(2) = 2</text>
  <line x1="514" y1="190" x2="514" y2="172" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="526" y="185" font-size="11" fill="#e07b00">×2</text>
  <rect x="424" y="190" width="180" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="514" y="215" text-anchor="middle" font-size="13" fill="#047857">f(1) = 1</text>

  <text x="20" y="290" font-size="12" fill="#6b7280">阶乘 f(n) = n × f(n-1)：递到 f(1)=1 停下，再一层层乘回来。</text>
</svg>
