<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="15" font-weight="bold" fill="#1d4ed8">TCP vs UDP：一个「可靠但慢」，一个「快但不保证」</text>

  <!-- 左：TCP -->
  <text x="175" y="64" font-size="14" font-weight="bold" fill="#3b82f6" text-anchor="middle">TCP</text>
  <text x="175" y="84" font-size="11" fill="#1d4ed8" text-anchor="middle">（打电话）</text>
  <rect x="125" y="102" width="100" height="40" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="175" y="127" font-size="13" fill="#1d4ed8" text-anchor="middle">发送方</text>
  <rect x="125" y="214" width="100" height="40" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="175" y="239" font-size="13" fill="#1d4ed8" text-anchor="middle">接收方</text>
  <line x1="158" y1="142" x2="158" y2="208" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="192" y1="208" x2="192" y2="142" stroke="#e07b00" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="175" y="180" font-size="10" fill="#6b7280" text-anchor="middle">握手</text>
  <text x="175" y="272" font-size="12" fill="#4b5563" text-anchor="middle">可靠：有确认、有重传，不丢不乱序</text>
  <text x="175" y="294" font-size="11" fill="#9ca3af" text-anchor="middle">例：网页、文件下载、邮件</text>

  <!-- 右：UDP -->
  <text x="465" y="64" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">UDP</text>
  <text x="465" y="84" font-size="11" fill="#047857" text-anchor="middle">（发广播）</text>
  <rect x="415" y="102" width="100" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="465" y="127" font-size="13" fill="#047857" text-anchor="middle">发送方</text>
  <rect x="415" y="214" width="100" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="465" y="239" font-size="13" fill="#047857" text-anchor="middle">接收方</text>
  <line x1="465" y1="142" x2="465" y2="208" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="180" font-size="10" fill="#6b7280" text-anchor="middle">直发</text>
  <text x="465" y="272" font-size="12" fill="#4b5563" text-anchor="middle">尽力而为：不保证到、不保证顺序</text>
  <text x="465" y="294" font-size="11" fill="#9ca3af" text-anchor="middle">例：直播、游戏、DNS</text>
</svg>
