<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">SQL 注入 vs XSS：都是「把用户输入当成了代码」</text>

  <!-- SQL 注入（蓝） -->
  <text x="20" y="76" font-size="12.5" font-weight="bold" fill="#1d4ed8">SQL 注入 —— 输入被当成 SQL</text>
  <rect x="20" y="86" width="170" height="48" rx="5" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="115" font-size="12" fill="#b91c1c" text-anchor="middle">admin' -- </text>
  <line x1="190" y1="110" x2="246" y2="110" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="86" width="150" height="48" rx="5" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="325" y="106" font-size="10.5" fill="#4b5563" text-anchor="middle">WHERE name='admin'</text>
  <text x="325" y="126" font-size="10.5" fill="#9ca3af" text-anchor="middle">-- ' AND password</text>
  <text x="412" y="115" font-size="11" fill="#4b5563">输入被当成 SQL 执行</text>

  <!-- XSS（绿） -->
  <text x="20" y="172" font-size="12.5" font-weight="bold" fill="#047857">XSS —— 输入被当成网页</text>
  <rect x="20" y="182" width="170" height="48" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="105" y="202" font-size="10.5" fill="#b91c1c" text-anchor="middle">&lt;script&gt;</text>
  <text x="105" y="220" font-size="10.5" fill="#b91c1c" text-anchor="middle">alert('XSS')</text>
  <line x1="190" y1="206" x2="246" y2="206" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="182" width="150" height="48" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="325" y="202" font-size="10.5" fill="#4b5563" text-anchor="middle">浏览器当代码</text>
  <text x="325" y="220" font-size="10.5" fill="#b91c1c" text-anchor="middle">弹出提示框</text>
  <text x="412" y="211" font-size="11" fill="#4b5563">输入被当成网页执行</text>

  <text x="210" y="270" font-size="12" fill="#4b5563" text-anchor="middle">共同病根——别让用户输入变成代码；SQL 用参数化查询，XSS 用转义</text>
</svg>
