<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">HTTPS = HTTP + TLS：加密传输，证书验明身份</text>

  <!-- HTTP（红，明文） -->
  <text x="20" y="60" font-size="12.5" font-weight="bold" fill="#b91c1c">HTTP —— 明文裸奔</text>
  <rect x="20" y="70" width="120" height="46" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="80" y="98" font-size="12" fill="#4b5563" text-anchor="middle">浏览器</text>
  <line x1="140" y1="93" x2="252" y2="93" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="196" y="85" font-size="11" fill="#b91c1c" text-anchor="middle">密码 123456</text>
  <rect x="256" y="70" width="120" height="46" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="316" y="98" font-size="12" fill="#4b5563" text-anchor="middle">服务器</text>
  <text x="390" y="98" font-size="11" fill="#4b5563">中间人看得见、能改</text>

  <!-- HTTPS（绿，加密） -->
  <text x="20" y="158" font-size="12.5" font-weight="bold" fill="#047857">HTTPS —— 加密 + 证书</text>
  <rect x="20" y="168" width="120" height="46" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="80" y="196" font-size="12" fill="#4b5563" text-anchor="middle">浏览器</text>
  <line x1="140" y1="191" x2="252" y2="191" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="196" y="183" font-size="11" fill="#047857" text-anchor="middle">#x9@!k</text>
  <rect x="256" y="168" width="120" height="46" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="316" y="196" font-size="12" fill="#4b5563" text-anchor="middle">服务器</text>
  <text x="390" y="196" font-size="11" fill="#4b5563">加密看不懂，证书验身份</text>

  <text x="210" y="270" font-size="12" fill="#4b5563" text-anchor="middle">证书 = 网站的身份证明，由 CA 签发；HTTPS 加密 ≠ 网站可信</text>
</svg>
