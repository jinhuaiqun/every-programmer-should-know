<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">一个 float（32 位）是怎么拆的</text>

  <rect x="30" y="50" width="80" height="70" rx="8" fill="#374151"/>
  <text x="70" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">符号</text>
  <text x="70" y="104" text-anchor="middle" font-size="11" fill="#d1d5db">1 位</text>

  <rect x="122" y="50" width="140" height="70" rx="8" fill="#3b82f6"/>
  <text x="192" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">指数</text>
  <text x="192" y="104" text-anchor="middle" font-size="11" fill="#dbeafe">8 位</text>

  <rect x="274" y="50" width="256" height="70" rx="8" fill="#10b981"/>
  <text x="402" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">尾数（有效数字）</text>
  <text x="402" y="104" text-anchor="middle" font-size="11" fill="#d1fae5">23 位</text>

  <text x="20" y="160" font-size="13" fill="#6b7280">= 符号 × 1.尾数 × 2^指数　——　也就是二进制的科学计数法</text>
</svg>
