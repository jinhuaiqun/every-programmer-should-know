<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">编译 = 转换程序的表示（不一定生成机器码）</text>

  <rect x="20" y="60" width="120" height="60" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">源代码</text>
  <text x="80" y="108" text-anchor="middle" font-size="11" fill="#6b7280">（人写的 .c / .py）</text>

  <rect x="200" y="60" width="130" height="60" rx="8" fill="#fff7ed" stroke="#e07b00" stroke-width="1.5"/>
  <text x="265" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">编译</text>
  <text x="265" y="106" text-anchor="middle" font-size="11" fill="#6b7280">（转换表示）</text>

  <rect x="390" y="60" width="150" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="465" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">机器码 / 字节码</text>
  <text x="465" y="106" text-anchor="middle" font-size="11" fill="#6b7280">（另一种表示）</text>

  <line x1="140" y1="90" x2="196" y2="90" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="90" x2="386" y2="90" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="152" font-size="12" fill="#6b7280">编译不一定生成机器码：C 还要链接成可执行文件，Java、Python 编译出来的是字节码。</text>
</svg>
