<svg xmlns="http://www.w3.org/2000/svg" width="540" height="270" viewBox="0 0 540 270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="20" y="30" width="190" height="200" rx="10" fill="#eef4ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="115" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">栈（stack）</text>

  <rect x="40" y="90" width="150" height="50" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="112" text-anchor="middle" font-size="14" fill="#111827">p（指针）</text>
  <text x="115" y="130" text-anchor="middle" font-size="11" fill="#6b7280">✗ 指针丢了</text>

  <line x1="190" y1="115" x2="260" y2="115" stroke="#e07b00" stroke-width="2.5" stroke-dasharray="6 6"/>

  <rect x="290" y="30" width="230" height="200" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="405" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">堆（heap）</text>

  <rect x="310" y="90" width="190" height="90" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="405" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">这块内存</text>
  <text x="405" y="138" text-anchor="middle" font-size="12" fill="#374151">再也找不到了</text>
  <text x="405" y="156" text-anchor="middle" font-size="12" fill="#374151">也没人能释放它</text>

  <text x="20" y="255" font-size="13" fill="#6b7280">无垃圾回收的语言（如 C）：指针一丢，内存就找不回来，也还不上——泄漏。</text>
</svg>
