<svg xmlns="http://www.w3.org/2000/svg" width="320" height="290" viewBox="0 0 320 290" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="20" y="20" width="180" height="250" rx="10" fill="#eef4ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">栈（stack）</text>

  <rect x="45" y="176" width="130" height="34" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="198" text-anchor="middle" font-size="13" fill="#111827">f()</text>

  <rect x="45" y="137" width="130" height="34" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="159" text-anchor="middle" font-size="13" fill="#111827">f()</text>

  <rect x="45" y="98" width="130" height="34" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="120" text-anchor="middle" font-size="13" fill="#111827">f()</text>

