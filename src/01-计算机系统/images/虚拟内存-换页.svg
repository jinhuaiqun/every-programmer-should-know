<svg xmlns="http://www.w3.org/2000/svg" width="620" height="250" viewBox="0 0 620 250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">内存不够时，把不常用的页搬到磁盘</text>

  <text x="30" y="60" font-size="13" font-weight="bold" fill="#047857">物理内存</text>
  <rect x="30" y="70" width="280" height="110" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="45" y="85" width="55" height="55" rx="5" fill="#ffffff" stroke="#10b981"/>
  <text x="72" y="118" text-anchor="middle" font-size="13" fill="#047857">页 A</text>
  <rect x="110" y="85" width="55" height="55" rx="5" fill="#ffffff" stroke="#10b981"/>
  <text x="137" y="118" text-anchor="middle" font-size="13" fill="#047857">页 B</text>
  <rect x="175" y="85" width="55" height="55" rx="5" fill="#fff7ed" stroke="#e07b00"/>
  <text x="202" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">冷页</text>
  <rect x="240" y="85" width="55" height="55" rx="5" fill="#ffffff" stroke="#10b981"/>
  <text x="267" y="118" text-anchor="middle" font-size="13" fill="#047857">页 D</text>

  <text x="440" y="60" font-size="13" font-weight="bold" fill="#8b5cf6">磁盘（慢）</text>
  <rect x="440" y="70" width="140" height="110" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="455" y="85" width="110" height="55" rx="5" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="510" y="118" text-anchor="middle" font-size="13" fill="#8b5cf6">换出的页</text>

  <path d="M230,112 C 330,112 380,112 453,112" stroke="#e07b00" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="375" y="100" text-anchor="middle" font-size="12" fill="#e07b00">换出</text>
  <path d="M453,135 C 380,135 330,135 230,135" stroke="#e07b00" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="375" y="150" text-anchor="middle" font-size="12" fill="#e07b00">要用时换回来</text>

  <text x="20" y="220" font-size="12" fill="#6b7280">换出 = 把不常用的页搬到磁盘；换入 = 要用时再搬回来。</text>
</svg>
