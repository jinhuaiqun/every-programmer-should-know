<svg xmlns="http://www.w3.org/2000/svg" width="660" height="260" viewBox="0 0 660 260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#111827">进程：各有各的独立内存空间</text>

  <rect x="30" y="55" width="280" height="175" rx="10" fill="#374151" stroke="#374151" stroke-width="2"/>
  <text x="170" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">进程 A</text>

  <rect x="48" y="96" width="110" height="42" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="103" y="122" text-anchor="middle" font-size="13" fill="#111827">代码</text>
  <rect x="170" y="96" width="120" height="42" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="230" y="122" text-anchor="middle" font-size="13" fill="#111827">数据</text>

  <rect x="48" y="150" width="110" height="62" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="103" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">堆</text>
  <rect x="170" y="150" width="120" height="62" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="230" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">栈</text>

  <line x1="327" y1="70" x2="327" y2="215" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>

  <rect x="350" y="55" width="280" height="175" rx="10" fill="#374151" stroke="#374151" stroke-width="2"/>
  <text x="490" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">进程 B</text>

  <rect x="368" y="96" width="110" height="42" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="423" y="122" text-anchor="middle" font-size="13" fill="#111827">代码</text>
  <rect x="490" y="96" width="120" height="42" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="550" y="122" text-anchor="middle" font-size="13" fill="#111827">数据</text>

  <rect x="368" y="150" width="110" height="62" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="423" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">堆</text>
  <rect x="490" y="150" width="120" height="62" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">栈</text>

  <text x="20" y="252" font-size="12" fill="#6b7280">两个进程各占一块内存，互不干扰——一个崩了，另一个没事。</text>
</svg>
