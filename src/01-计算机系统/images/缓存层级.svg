<svg xmlns="http://www.w3.org/2000/svg" width="660" height="200" viewBox="0 0 660 200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="20" y="60" width="60" height="70" rx="8" fill="#374151"/>
  <text x="50" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">CPU</text>
  <text x="50" y="112" text-anchor="middle" font-size="10" fill="#d1d5db">最快</text>

  <rect x="95" y="60" width="70" height="70" rx="8" fill="#c2410c"/>
  <text x="130" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">L1 缓存</text>
  <text x="130" y="108" text-anchor="middle" font-size="10" fill="#fed7aa">几十 KB</text>

  <rect x="180" y="60" width="80" height="70" rx="8" fill="#ea580c"/>
  <text x="220" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">L2 缓存</text>
  <text x="220" y="108" text-anchor="middle" font-size="10" fill="#fed7aa">几百 KB</text>

  <rect x="275" y="60" width="95" height="70" rx="8" fill="#f59e0b"/>
  <text x="322" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">L3 缓存</text>
  <text x="322" y="108" text-anchor="middle" font-size="10" fill="#fef3c7">几~几十 MB</text>

  <rect x="385" y="60" width="120" height="70" rx="8" fill="#10b981"/>
  <text x="445" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">内存</text>
  <text x="445" y="108" text-anchor="middle" font-size="10" fill="#d1fae5">几 GB</text>

  <rect x="520" y="60" width="120" height="70" rx="8" fill="#8b5cf6"/>
  <text x="580" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">磁盘</text>
  <text x="580" y="108" text-anchor="middle" font-size="10" fill="#ede9fe">TB 级</text>

  <text x="20" y="42" font-size="12" fill="#6b7280">离 CPU 越近 → 越快、越小；离得越远 → 越慢、越大</text>
  <text x="20" y="165" font-size="12" fill="#6b7280">CPU 取数据：先 L1 → L2 → L3 → 内存，哪层找到用哪层，找不到才往下。</text>
  <text x="20" y="185" font-size="11" fill="#9ca3af">注：磁盘已慢到另一个量级，列出来只为对比。</text>
</svg>
