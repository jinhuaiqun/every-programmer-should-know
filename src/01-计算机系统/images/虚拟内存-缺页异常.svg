<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">缺页异常：访问的页不可用时怎么办</text>

  <rect x="220" y="46" width="200" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="320" y="69" text-anchor="middle" font-size="13" fill="#111827">程序访问虚拟地址</text>

  <rect x="220" y="100" width="200" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="320" y="123" text-anchor="middle" font-size="13" fill="#111827">MMU 查页表：这个页不可用</text>

  <rect x="220" y="154" width="200" height="36" rx="6" fill="#fff7ed" stroke="#e07b00" stroke-width="1.5"/>
  <text x="320" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">触发缺页异常</text>

  <rect x="220" y="208" width="200" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="320" y="231" text-anchor="middle" font-size="13" fill="#111827">操作系统判断原因</text>

  <rect x="30" y="276" width="180" height="56" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="120" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">首次访问</text>
  <text x="120" y="319" text-anchor="middle" font-size="12" fill="#047857">分配物理页框</text>

  <rect x="230" y="276" width="180" height="56" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="320" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b5cf6">被换出到磁盘</text>
  <text x="320" y="319" text-anchor="middle" font-size="12" fill="#8b5cf6">从磁盘读回来</text>

  <rect x="430" y="276" width="180" height="56" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="520" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">非法地址</text>
  <text x="520" y="319" text-anchor="middle" font-size="12" fill="#b91c1c">报错、终止进程</text>

  <rect x="220" y="364" width="200" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="320" y="387" text-anchor="middle" font-size="13" fill="#111827">更新页表</text>

  <rect x="220" y="418" width="200" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="320" y="441" text-anchor="middle" font-size="13" fill="#111827">重新执行刚才那条指令</text>

  <line x1="320" y1="82" x2="320" y2="98" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="136" x2="320" y2="152" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="190" x2="320" y2="206" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="320" y1="244" x2="120" y2="274" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="244" x2="320" y2="274" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="244" x2="520" y2="274" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="120" y1="332" x2="320" y2="362" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="332" x2="320" y2="362" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="332" x2="320" y2="362" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="320" y1="400" x2="320" y2="416" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
