<svg xmlns="http://www.w3.org/2000/svg" width="540" height="300" viewBox="0 0 540 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="190" height="220" rx="10" fill="#eef4ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="115" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">栈（stack）</text>

  <rect x="40" y="80" width="150" height="52" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="103" text-anchor="middle" font-size="15" fill="#111827">p（便利贴）</text>
  <text x="115" y="121" text-anchor="middle" font-size="11" fill="#6b7280">存的是对象的地址</text>

  <rect x="40" y="150" width="150" height="44" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="177" text-anchor="middle" font-size="15" fill="#111827">a = 5</text>
  <text x="115" y="210" text-anchor="middle" font-size="11" fill="#6b7280">小数据，直接住在栈上</text>

  <line x1="190" y1="106" x2="282" y2="106" stroke="#e07b00" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="290" y="30" width="230" height="220" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="405" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">堆（heap）</text>

  <rect x="310" y="80" width="190" height="96" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="405" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Person 对象</text>
  <text x="405" y="128" text-anchor="middle" font-size="13" fill="#374151">name = "小明"</text>
  <text x="405" y="150" text-anchor="middle" font-size="13" fill="#374151">age = 18</text>

  <text x="20" y="280" font-size="13" fill="#6b7280">经典简化模型：便利贴在栈，箱子在堆（实际位置取决于语言）。</text>
</svg>
