<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">磁盘上一堆字节，被文件系统组织成文件</text>

  <text x="20" y="55" font-size="13" fill="#374151">磁盘（一堆字节）</text>
  <rect x="20" y="65" width="190" height="120" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="34" y="95" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="#8b5cf6">0110100110110010</text>
  <text x="34" y="120" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="#8b5cf6">1011001000111010</text>
  <text x="34" y="145" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="#8b5cf6">0011101001101001</text>
  <text x="34" y="170" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="#8b5cf6">1100100110100110</text>

  <line x1="210" y1="125" x2="310" y2="125" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="114" text-anchor="middle" font-size="12" fill="#e07b00">文件系统组织</text>

  <text x="320" y="55" font-size="13" fill="#374151">文件 + 目录（有组织）</text>

  <rect x="330" y="70" width="60" height="34" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">/</text>

  <rect x="430" y="80" width="100" height="30" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="480" y="99" text-anchor="middle" font-size="13" fill="#111827">a.txt</text>

  <rect x="430" y="120" width="100" height="30" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="480" y="139" text-anchor="middle" font-size="13" fill="#111827">b.txt</text>

  <rect x="430" y="160" width="100" height="30" rx="5" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="179" text-anchor="middle" font-size="13" fill="#1d4ed8">照片/</text>

  <rect x="560" y="160" width="80" height="30" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="600" y="179" text-anchor="middle" font-size="13" fill="#111827">猫.jpg</text>

  <path d="M390,87 L430,95" stroke="#9ca3af" stroke-width="1.2" fill="none"/>
  <path d="M390,87 L430,135" stroke="#9ca3af" stroke-width="1.2" fill="none"/>
  <path d="M390,87 L430,175" stroke="#9ca3af" stroke-width="1.2" fill="none"/>
  <path d="M530,175 L560,175" stroke="#9ca3af" stroke-width="1.2" fill="none"/>

  <text x="20" y="220" font-size="12" fill="#6b7280">文件系统把没有名字、没有分类的字节，整理成有名字、有层级的文件。</text>
</svg>
