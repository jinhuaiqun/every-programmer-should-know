<svg xmlns="http://www.w3.org/2000/svg" width="540" height="360" viewBox="0 0 540 360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="270" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">分治：把大问题拆成小问题，逐个解决，再合并</text>

  <rect x="170" y="60" width="200" height="48" rx="8" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">大问题</text>

  <line x1="270" y1="108" x2="115" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="108" x2="270" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="108" x2="425" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="162" width="130" height="48" rx="8" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">小问题</text>
  <rect x="205" y="162" width="130" height="48" rx="8" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="270" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">小问题</text>
  <rect x="360" y="162" width="130" height="48" rx="8" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="425" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">小问题</text>

  <line x1="115" y1="210" x2="270" y2="262" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="210" x2="270" y2="262" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="425" y1="210" x2="270" y2="262" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="170" y="264" width="200" height="48" rx="8" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">答案</text>

  <text x="270" y="340" text-anchor="middle" font-size="13" fill="#6b7280">拆到好解决为止，再逐层合并回来。</text>
</svg>
