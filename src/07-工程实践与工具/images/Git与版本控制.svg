<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">Git 四站与分支：工作区 → 暂存区 → 本地仓库 → 远程仓库</text>

  <!-- 四站 -->
  <rect x="20" y="52" width="112" height="64" rx="5" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="76" y="78" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">工作区</text>
  <text x="76" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">正在编辑</text>

  <line x1="132" y1="84" x2="172" y2="84" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="152" y="74" font-size="11" fill="#e07b00" text-anchor="middle">add</text>

  <rect x="176" y="52" width="112" height="64" rx="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="232" y="78" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">暂存区</text>
  <text x="232" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">git add</text>

  <line x1="288" y1="84" x2="328" y2="84" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="308" y="74" font-size="11" fill="#e07b00" text-anchor="middle">commit</text>

  <rect x="332" y="52" width="112" height="64" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="388" y="78" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">本地仓库</text>
  <text x="388" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">git commit</text>

  <line x1="444" y1="84" x2="484" y2="84" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="74" font-size="11" fill="#e07b00" text-anchor="middle">push</text>

  <rect x="488" y="52" width="112" height="64" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="544" y="78" font-size="12" font-weight="bold" fill="#6d28d9" text-anchor="middle">远程仓库</text>
  <text x="544" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">git push</text>

  <text x="320" y="140" font-size="11.5" fill="#4b5563" text-anchor="middle">add 挑改动 · commit 存快照 · push 上传远程</text>

  <!-- 分支（平行宇宙） -->
  <line x1="60" y1="230" x2="520" y2="230" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="100" cy="230" r="5" fill="#10b981"/>
  <circle cx="210" cy="230" r="5" fill="#10b981"/>
  <circle cx="470" cy="230" r="5" fill="#10b981"/>
  <line x1="210" y1="230" x2="270" y2="190" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="270" y1="190" x2="400" y2="190" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="400" y1="190" x2="470" y2="230" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="335" cy="190" r="5" fill="#3b82f6"/>
  <text x="80" y="252" font-size="11" fill="#047857">主干</text>
  <text x="300" y="180" font-size="11" fill="#1d4ed8">开发分支</text>

  <text x="320" y="300" font-size="12" fill="#4b5563" text-anchor="middle">分支 = 轻量指针，开「平行宇宙」；commit 是快照，不是差异</text>
</svg>
