<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">构建与依赖管理：源码 → 产物，第三方库套娃</text>

  <!-- 构建 -->
  <text x="20" y="56" font-size="12.5" font-weight="bold" fill="#1d4ed8">构建：源码 → 可运行程序</text>
  <rect x="20" y="64" width="120" height="56" rx="5" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="90" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">源码</text>
  <text x="80" y="108" font-size="10.5" fill="#4b5563" text-anchor="middle">源码文件</text>
  <line x1="140" y1="92" x2="176" y2="92" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="158" y="84" font-size="11" fill="#e07b00" text-anchor="middle">编译</text>

  <rect x="180" y="64" width="120" height="56" rx="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="240" y="90" font-size="12.5" font-weight="bold" fill="#c2410c" text-anchor="middle">编译</text>
  <text x="240" y="108" font-size="10.5" fill="#4b5563" text-anchor="middle">机器码/字节码</text>
  <line x1="300" y1="92" x2="336" y2="92" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="318" y="84" font-size="11" fill="#e07b00" text-anchor="middle">打包</text>

  <rect x="340" y="64" width="120" height="56" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="90" font-size="12.5" font-weight="bold" fill="#047857" text-anchor="middle">打包</text>
  <text x="400" y="108" font-size="10.5" fill="#4b5563" text-anchor="middle">可运行程序</text>

  <!-- 依赖 -->
  <text x="20" y="150" font-size="12.5" font-weight="bold" fill="#047857">依赖：套娃的第三方库</text>
  <rect x="20" y="158" width="120" height="56" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="80" y="191" font-size="12.5" font-weight="bold" fill="#6d28d9" text-anchor="middle">你的项目</text>
  <line x1="140" y1="186" x2="176" y2="186" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="158" width="100" height="56" rx="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="230" y="191" font-size="12.5" font-weight="bold" fill="#c2410c" text-anchor="middle">库 A</text>
  <line x1="280" y1="186" x2="306" y2="186" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="310" y="158" width="100" height="56" rx="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="191" font-size="12.5" font-weight="bold" fill="#c2410c" text-anchor="middle">库 B</text>
  <line x1="410" y1="186" x2="436" y2="186" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="158" width="100" height="56" rx="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="490" y="191" font-size="12.5" font-weight="bold" fill="#c2410c" text-anchor="middle">库 C</text>

  <text x="320" y="250" font-size="11.5" fill="#4b5563" text-anchor="middle">传递依赖：项目 → 库 A → 库 B → 库 C，一层套一层</text>

  <text x="320" y="285" font-size="12" fill="#4b5563" text-anchor="middle">锁文件锁定精确版本，提高可复现；小心依赖冲突</text>
</svg>
