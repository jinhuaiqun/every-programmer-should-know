<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">单元测试：断言「给定输入，应得输出」</text>

  <!-- 通过（绿） -->
  <rect x="100" y="52" width="120" height="44" rx="5" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="79" font-size="13" fill="#4b5563" text-anchor="middle">n = 4</text>
  <line x1="220" y1="74" x2="256" y2="74" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="52" width="120" height="44" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="79" font-size="12" fill="#4b5563" text-anchor="middle">is_even(n)</text>
  <line x1="380" y1="74" x2="416" y2="74" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="52" width="120" height="44" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="480" y="79" font-size="13" font-weight="bold" fill="#4b5563" text-anchor="middle">True</text>
  <text x="272" y="118" font-size="11.5" fill="#4b5563" text-anchor="middle">assert is_even(4) == True</text>
  <text x="395" y="118" font-size="11.5" font-weight="bold" fill="#047857">✓ 通过</text>

  <!-- 失败（红） -->
  <rect x="100" y="146" width="120" height="44" rx="5" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="173" font-size="13" fill="#4b5563" text-anchor="middle">n = 7</text>
  <line x1="220" y1="168" x2="256" y2="168" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="146" width="120" height="44" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="173" font-size="12" fill="#4b5563" text-anchor="middle">is_even(n)</text>
  <line x1="380" y1="168" x2="416" y2="168" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="146" width="120" height="44" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="480" y="173" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">True</text>
  <text x="272" y="212" font-size="11.5" fill="#4b5563" text-anchor="middle">assert is_even(7) == False</text>
  <text x="395" y="212" font-size="11.5" font-weight="bold" fill="#b91c1c">✗ 失败</text>

  <text x="320" y="250" font-size="12" fill="#4b5563" text-anchor="middle">改完代码跑一遍——全绿 = 通过现有测试，有红 = 需要排查</text>
</svg>
