<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">调试 = 缩小范围：复现 → 读报错 → 假设 → 验证</text>

  <!-- 五步流程 -->
  <rect x="20" y="54" width="100" height="58" rx="5" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="80" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">复现</text>
  <text x="70" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">稳定出现</text>
  <line x1="120" y1="83" x2="148" y2="83" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="54" width="100" height="58" rx="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="200" y="80" font-size="12.5" font-weight="bold" fill="#c2410c" text-anchor="middle">读报错</text>
  <text x="200" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">行号·类型</text>
  <line x1="250" y1="83" x2="278" y2="83" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="54" width="100" height="58" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="330" y="80" font-size="12.5" font-weight="bold" fill="#6d28d9" text-anchor="middle">假设</text>
  <text x="330" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">猜一个原因</text>
  <line x1="380" y1="83" x2="408" y2="83" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="410" y="54" width="100" height="58" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="460" y="80" font-size="12.5" font-weight="bold" fill="#047857" text-anchor="middle">验证</text>
  <text x="460" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">断点确认</text>
  <line x1="510" y1="83" x2="538" y2="83" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="540" y="54" width="100" height="58" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="590" y="80" font-size="12.5" font-weight="bold" fill="#047857" text-anchor="middle">锁定</text>
  <text x="590" y="100" font-size="10.5" fill="#4b5563" text-anchor="middle">缩小到一行</text>

  <text x="320" y="138" font-size="12.5" fill="#4b5563" text-anchor="middle">调试 = 侦探破案：一步步缩小范围，直到锁定那一行</text>

  <!-- print vs 断点 -->
  <rect x="120" y="160" width="190" height="56" rx="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="215" y="184" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">print</text>
  <text x="215" y="204" font-size="11.5" fill="#4b5563" text-anchor="middle">只能看一个值，反复改代码</text>

  <text x="325" y="192" font-size="13" fill="#9ca3af" text-anchor="middle">vs</text>

  <rect x="340" y="160" width="190" height="56" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="435" y="184" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">断点</text>
  <text x="435" y="204" font-size="11.5" fill="#4b5563" text-anchor="middle">暂停，看所有变量和调用栈</text>

  <text x="320" y="250" font-size="13" fill="#4b5563" text-anchor="middle">print 像撒面包屑，断点像停下来看地图；先读报错，别瞎改</text>
</svg>
