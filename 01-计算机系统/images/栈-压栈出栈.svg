<svg xmlns="http://www.w3.org/2000/svg" width="440" height="340" viewBox="0 0 440 340" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="20" y="20" width="220" height="290" rx="10" fill="#eef4ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">栈（stack）</text>

  <!-- B()：栈顶 -->
  <rect x="45" y="72" width="170" height="64" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">B()</text>
  <text x="130" y="116" text-anchor="middle" font-size="12" fill="#6b7280">变量 b1、b2</text>

  <!-- A() -->
  <rect x="45" y="144" width="170" height="64" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="167" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">A()</text>
  <text x="130" y="188" text-anchor="middle" font-size="12" fill="#6b7280">变量 a1</text>

  <!-- main()：栈底 -->
  <rect x="45" y="216" width="170" height="64" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">main()</text>
  <text x="130" y="260" text-anchor="middle" font-size="12" fill="#6b7280">变量 a、b</text>

  <!-- 右侧标注 -->
  <text x="260" y="98" font-size="13" fill="#1d4ed8">← 栈顶</text>
  <text x="260" y="116" font-size="11" fill="#6b7280">最后进来，最先出去</text>
  <text x="260" y="242" font-size="13" fill="#1d4ed8">← 栈底</text>
  <text x="260" y="260" font-size="11" fill="#6b7280">最先进来，最后出去</text>

  <!-- 底部说明 -->
  <text x="20" y="328" font-size="12" fill="#6b7280">每一层是一个函数调用，层里装的是这个函数的局部变量。</text>
</svg>
