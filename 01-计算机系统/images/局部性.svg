<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#111827">① 时间局部性：刚用过的，马上还会用</text>

  <rect x="60" y="55" width="110" height="60" rx="8" fill="#ffffff" stroke="#e07b00" stroke-width="2"/>
  <text x="115" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">数据 A</text>
  <text x="115" y="102" text-anchor="middle" font-size="11" fill="#6b7280">比如循环计数器 i</text>

  <path d="M 175 70 C 235 40, 235 105, 175 90" fill="none" stroke="#e07b00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="68" font-size="12" fill="#e07b00">反复访问</text>

  <text x="20" y="175" font-size="15" font-weight="bold" fill="#111827">② 空间局部性：用了一个，旁边的马上也会用</text>

  <rect x="60" y="200" width="60" height="50" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="90" y="230" text-anchor="middle" font-size="14" fill="#111827">A</text>
  <rect x="128" y="200" width="60" height="50" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="158" y="230" text-anchor="middle" font-size="14" fill="#111827">B</text>
  <rect x="196" y="200" width="60" height="50" fill="#fff7ed" stroke="#e07b00" stroke-width="2"/>
  <text x="226" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#e07b00">C</text>
  <rect x="264" y="200" width="60" height="50" fill="#fff7ed" stroke="#e07b00" stroke-width="2"/>
  <text x="294" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#e07b00">D</text>
  <rect x="332" y="200" width="60" height="50" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="362" y="230" text-anchor="middle" font-size="14" fill="#111827">E</text>

  <line x1="226" y1="195" x2="294" y2="195" stroke="#e07b00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#e07b00">访问了 C，接着访问旁边的 D</text>
</svg>
