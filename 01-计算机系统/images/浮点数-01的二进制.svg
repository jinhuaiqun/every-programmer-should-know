<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">0.1 在二进制里无限循环</text>

  <text x="20" y="92" font-size="20" font-weight="bold" fill="#1d4ed8">0.00011</text>

  <rect x="110" y="64" width="66" height="42" rx="6" fill="#fff7ed" stroke="#e07b00" stroke-width="1.5"/>
  <text x="143" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">0011</text>
  <rect x="184" y="64" width="66" height="42" rx="6" fill="#fff7ed" stroke="#e07b00" stroke-width="1.5"/>
  <text x="217" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">0011</text>
  <rect x="258" y="64" width="66" height="42" rx="6" fill="#fff7ed" stroke="#e07b00" stroke-width="1.5"/>
  <text x="291" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">0011</text>
  <text x="332" y="92" font-size="20" fill="#e07b00">……</text>

  <rect x="102" y="56" width="240" height="58" rx="6" fill="none" stroke="#e07b00" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="222" y1="114" x2="222" y2="138" stroke="#e07b00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="222" y="152" text-anchor="middle" font-size="13" fill="#e07b00">「0011」这一段会一直循环</text>

  <text x="20" y="188" font-size="15" fill="#374151">尾数只有 52 位，装不下 <tspan font-weight="bold" fill="#e07b00">→</tspan> <tspan font-weight="bold" fill="#ef4444">丢掉</tspan></text>
</svg>
