<svg xmlns="http://www.w3.org/2000/svg" width="320" height="520" viewBox="0 0 320 520" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="20" y="26" font-size="14" font-weight="bold" fill="#111827">三种进制对照（0 ~ 15）</text>

  <text x="50" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">十进制</text>
  <text x="150" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">二进制</text>
  <text x="250" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">十六进制</text>

  <text x="50" y="80" text-anchor="middle" font-size="13" fill="#374151">0</text>
  <text x="150" y="80" text-anchor="middle" font-size="13" fill="#374151">0000</text>
  <text x="250" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">0</text>

  <text x="50" y="106" text-anchor="middle" font-size="13" fill="#374151">1</text>
  <text x="150" y="106" text-anchor="middle" font-size="13" fill="#374151">0001</text>
  <text x="250" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">1</text>

  <text x="50" y="132" text-anchor="middle" font-size="13" fill="#374151">2</text>
  <text x="150" y="132" text-anchor="middle" font-size="13" fill="#374151">0010</text>
  <text x="250" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">2</text>

  <text x="50" y="158" text-anchor="middle" font-size="13" fill="#374151">3</text>
  <text x="150" y="158" text-anchor="middle" font-size="13" fill="#374151">0011</text>
  <text x="250" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">3</text>

  <text x="50" y="184" text-anchor="middle" font-size="13" fill="#374151">4</text>
  <text x="150" y="184" text-anchor="middle" font-size="13" fill="#374151">0100</text>
  <text x="250" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">4</text>

  <text x="50" y="210" text-anchor="middle" font-size="13" fill="#374151">5</text>
  <text x="150" y="210" text-anchor="middle" font-size="13" fill="#374151">0101</text>
  <text x="250" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">5</text>

  <text x="50" y="236" text-anchor="middle" font-size="13" fill="#374151">6</text>
  <text x="150" y="236" text-anchor="middle" font-size="13" fill="#374151">0110</text>
  <text x="250" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">6</text>

  <text x="50" y="262" text-anchor="middle" font-size="13" fill="#374151">7</text>
  <text x="150" y="262" text-anchor="middle" font-size="13" fill="#374151">0111</text>
  <text x="250" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">7</text>

  <text x="50" y="288" text-anchor="middle" font-size="13" fill="#374151">8</text>
  <text x="150" y="288" text-anchor="middle" font-size="13" fill="#374151">1000</text>
  <text x="250" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">8</text>

  <text x="50" y="314" text-anchor="middle" font-size="13" fill="#374151">9</text>
  <text x="150" y="314" text-anchor="middle" font-size="13" fill="#374151">1001</text>
  <text x="250" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">9</text>

  <text x="50" y="340" text-anchor="middle" font-size="13" fill="#374151">10</text>
  <text x="150" y="340" text-anchor="middle" font-size="13" fill="#374151">1010</text>
  <text x="250" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">A</text>

  <text x="50" y="366" text-anchor="middle" font-size="13" fill="#374151">11</text>
  <text x="150" y="366" text-anchor="middle" font-size="13" fill="#374151">1011</text>
  <text x="250" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">B</text>

  <text x="50" y="392" text-anchor="middle" font-size="13" fill="#374151">12</text>
  <text x="150" y="392" text-anchor="middle" font-size="13" fill="#374151">1100</text>
  <text x="250" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">C</text>

  <text x="50" y="418" text-anchor="middle" font-size="13" fill="#374151">13</text>
  <text x="150" y="418" text-anchor="middle" font-size="13" fill="#374151">1101</text>
  <text x="250" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">D</text>

  <text x="50" y="444" text-anchor="middle" font-size="13" fill="#374151">14</text>
  <text x="150" y="444" text-anchor="middle" font-size="13" fill="#374151">1110</text>
  <text x="250" y="444" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">E</text>

  <text x="50" y="470" text-anchor="middle" font-size="13" fill="#374151">15</text>
  <text x="150" y="470" text-anchor="middle" font-size="13" fill="#374151">1111</text>
  <text x="250" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">F</text>

  <text x="20" y="500" font-size="12" fill="#6b7280">每 4 位二进制，正好对应 1 位十六进制（0-9、A-F）。</text>
