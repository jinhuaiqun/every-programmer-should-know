<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="20" y="28" font-size="14" font-weight="bold" fill="#111827">一个 float（32 位）是怎么拆的</text>

  <rect x="30" y="60" width="70" height="64" rx="8" fill="#e07b00"/>
  <text x="65" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">符号</text>
  <text x="65" y="108" text-anchor="middle" font-size="11" fill="#fde68a">1 位</text>

  <rect x="110" y="60" width="130" height="64" rx="8" fill="#3b82f6"/>
  <text x="175" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">指数</text>
  <text x="175" y="108" text-anchor="middle" font-size="11" fill="#dbeafe">8 位</text>

  <rect x="250" y="60" width="280" height="64" rx="8" fill="#10b981"/>
  <text x="390" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">尾数（有效数字）</text>
  <text x="390" y="108" text-anchor="middle" font-size="11" fill="#d1fae5">23 位</text>

  <text x="20" y="160" font-size="13" fill="#6b7280">= 符号 × 1.尾数 × 2^指数　——　也就是二进制的科学计数法</text>
</svg>
