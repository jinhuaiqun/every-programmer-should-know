<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">硬链接 vs 软链接</text>

  <text x="20" y="58" font-size="13" fill="#374151">硬链接：两个名字，同一张档案卡</text>
  <rect x="20" y="68" width="90" height="34" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="65" y="90" text-anchor="middle" font-size="13" fill="#1d4ed8">a.txt</text>
  <rect x="20" y="112" width="90" height="34" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="65" y="134" text-anchor="middle" font-size="13" fill="#1d4ed8">b.txt</text>

  <rect x="160" y="80" width="120" height="44" rx="6" fill="#fff7ed" stroke="#e07b00" stroke-width="1.5"/>
  <text x="220" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">inode 3</text>

  <rect x="330" y="80" width="110" height="44" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="385" y="107" text-anchor="middle" font-size="13" fill="#047857">数据块</text>

  <line x1="110" y1="85" x2="158" y2="100" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="129" x2="158" y2="104" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="102" x2="328" y2="102" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="200" font-size="13" fill="#374151">软链接：一个快捷方式，存的是路径</text>
  <rect x="20" y="210" width="90" height="44" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="65" y="236" text-anchor="middle" font-size="13" fill="#1d4ed8">link</text>

  <rect x="160" y="210" width="150" height="44" rx="6" fill="#fff7ed" stroke="#e07b00" stroke-width="1.5"/>
  <text x="235" y="228" text-anchor="middle" font-size="13" fill="#c2410c">内容 = 路径 "b.txt"</text>
  <text x="235" y="245" text-anchor="middle" font-size="11" fill="#6b7280">（特殊小文件）</text>

  <line x1="110" y1="232" x2="158" y2="232" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M310,232 L440,232" stroke="#e07b00" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
  <text x="375" y="222" text-anchor="middle" font-size="12" fill="#e07b00">按路径去找真正的 b.txt</text>

  <text x="20" y="282" font-size="12" fill="#6b7280">硬链接 = 同一档案卡的多个标签；软链接 = 写着"去这个路径找"的快捷方式。</text>
</svg>
