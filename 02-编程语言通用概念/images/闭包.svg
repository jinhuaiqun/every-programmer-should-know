<svg xmlns="http://www.w3.org/2000/svg" width="620" height="246" viewBox="0 0 620 246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
    <marker id="arrowL" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">闭包：函数「记住」了定义它的那个环境</text>

  <rect x="20" y="66" width="150" height="84" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="95" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">makeCounter()</text>
  <text x="95" y="120" text-anchor="middle" font-size="11" fill="#6b7280">已执行完、返回了</text>

  <rect x="250" y="66" width="130" height="84" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="315" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">count = 0</text>
  <text x="315" y="120" text-anchor="middle" font-size="11" fill="#6b7280">本应被回收</text>

  <rect x="460" y="66" width="140" height="84" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="530" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">counter()</text>
  <text x="530" y="120" text-anchor="middle" font-size="11" fill="#047857">（闭包）</text>

  <line x1="170" y1="108" x2="248" y2="108" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="108" x2="382" y2="108" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrowL)"/>

  <text x="210" y="172" text-anchor="middle" font-size="11" fill="#e07b00">局部变量</text>
  <text x="424" y="172" text-anchor="middle" font-size="11" fill="#e07b00">捕获（记住）</text>

  <text x="20" y="212" font-size="12" fill="#6b7280">makeCounter 已返回，count 本该被回收，却被 counter 抓住、继续活着——</text>
  <text x="20" y="232" font-size="12" fill="#6b7280">之后每次调 counter() 用的都是同一个 count。</text>
</svg>
