<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">泛型：Box&lt;T&gt; 是一个模板，T 是类型占位符</text>

  <rect x="40" y="52" width="560" height="46" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="298" y="81" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="end">Box&lt;</text>
  <text x="320" y="81" font-size="15" font-weight="bold" fill="#e07b00" text-anchor="middle">T</text>
  <text x="342" y="81" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="start">&gt;</text>

  <text x="320" y="118" font-size="12" fill="#6b7280" text-anchor="middle">用的时候，把 T 换成具体类型 ↓</text>

  <line x1="130" y1="98" x2="130" y2="138" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="98" x2="320" y2="138" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="98" x2="510" y2="138" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="142" width="180" height="50" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="130" y="164" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Box&lt;String&gt;</text>
  <text x="130" y="182" font-size="12" fill="#374151" text-anchor="middle">装字符串</text>

  <rect x="230" y="142" width="180" height="50" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="164" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Box&lt;Integer&gt;</text>
  <text x="320" y="182" font-size="12" fill="#374151" text-anchor="middle">装整数</text>

  <rect x="420" y="142" width="180" height="50" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="510" y="164" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Box&lt;Point&gt;</text>
  <text x="510" y="182" font-size="12" fill="#374151" text-anchor="middle">装自定义类</text>

  <text x="20" y="266" font-size="12" fill="#6b7280">一套模板，填入不同类型，就得到多种具体的盒子——不用为每种类型重写一遍。</text>
</svg>
