<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">从「隐式转换」看：强 vs 弱</text>

  <text x="55" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">强</text>
  <text x="55" y="102" text-anchor="middle" font-size="11" fill="#6b7280">（Python）</text>
  <rect x="130" y="60" width="220" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="142" y="89" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="#047857">"1" + 1</text>
  <line x1="350" y1="84" x2="392" y2="84" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="392" y="60" width="200" height="48" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="492" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">✗ 报错（TypeError）</text>
  <text x="492" y="97" text-anchor="middle" font-size="11" fill="#b91c1c">（不自动转）</text>

  <text x="55" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">弱</text>
  <text x="55" y="188" text-anchor="middle" font-size="11" fill="#6b7280">（JavaScript）</text>
  <rect x="130" y="146" width="220" height="48" rx="6" fill="#fff7ed" stroke="#e07b00" stroke-width="1.5"/>
  <text x="142" y="175" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="#c2410c">"1" + 1</text>
  <line x1="350" y1="170" x2="392" y2="170" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="392" y="146" width="200" height="48" rx="6" fill="#fff7ed" stroke="#e07b00" stroke-width="1.5"/>
  <text x="492" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">✓ 得到 "11"</text>
  <text x="492" y="183" text-anchor="middle" font-size="11" fill="#6b7280">（自动转成字符串）</text>

  <text x="20" y="222" font-size="12" fill="#6b7280">从「隐式转换」这个角度看：Python 报错，JavaScript 自动转，表达式短但容易埋坑。</text>
</svg>
