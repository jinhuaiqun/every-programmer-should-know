<svg xmlns="http://www.w3.org/2000/svg" width="640" height="275" viewBox="0 0 640 275" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">对象传参：复制的是"引用"，不是对象本身</text>

  <text x="20" y="54" font-size="13" font-weight="bold" fill="#1d4ed8">栈</text>
  <rect x="20" y="62" width="600" height="72" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="60" y="76" width="140" height="44" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="102" text-anchor="middle" font-size="13" fill="#1d4ed8">变量 a（引用）</text>
  <rect x="320" y="76" width="150" height="44" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="395" y="102" text-anchor="middle" font-size="13" fill="#1d4ed8">形参 b（引用副本）</text>

  <text x="20" y="182" font-size="13" font-weight="bold" fill="#047857">堆</text>
  <rect x="20" y="190" width="600" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="230" y="198" width="150" height="40" rx="5" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="305" y="222" text-anchor="middle" font-size="13" fill="#047857">对象（list）</text>

  <line x1="130" y1="120" x2="285" y2="198" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="395" y1="120" x2="325" y2="198" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="160" text-anchor="middle" font-size="11" fill="#e07b00">引用（地址）</text>

  <text x="20" y="266" font-size="12" fill="#6b7280">改内容（b.append(4)）→ 原对象变；重新赋值（b = 新对象）→ a 还指向旧对象。</text>
</svg>
