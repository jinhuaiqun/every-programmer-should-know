<svg xmlns="http://www.w3.org/2000/svg" width="620" height="280" viewBox="0 0 620 280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">try-catch-finally：出错也能妥善收场</text>

  <rect x="100" y="56" width="200" height="52" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">try { 可能出错 }</text>

  <rect x="380" y="56" width="140" height="52" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="450" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">catch { 处理 }</text>

  <rect x="100" y="180" width="420" height="52" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="310" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">finally { 清理资源 }</text>

  <line x1="300" y1="82" x2="376" y2="82" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="338" y="74" text-anchor="middle" font-size="11" fill="#b91c1c">出错</text>

  <line x1="170" y1="108" x2="170" y2="176" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="182" y="146" font-size="11" fill="#6b7280">没出错</text>

  <line x1="450" y1="108" x2="450" y2="176" stroke="#e07b00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="146" font-size="11" fill="#6b7280">处理完</text>

  <text x="20" y="264" font-size="12" fill="#6b7280">无论成功还是出错，finally 通常都会执行——用来释放文件、连接、锁等资源。</text>
</svg>
