<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="bold" fill="#1d4ed8">异常沿调用栈向外传播，直到被 catch 接住</text>

  <rect x="40" y="66" width="210" height="48" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="56" y="90" font-size="13" font-weight="bold" fill="#1d4ed8">f1()</text>
  <text x="56" y="106" font-size="12" fill="#047857">catch 接住 ✔</text>

  <rect x="40" y="146" width="210" height="48" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="56" y="170" font-size="13" font-weight="bold" fill="#1d4ed8">f2()</text>
  <text x="56" y="186" font-size="12" fill="#6b7280">没接住，继续传</text>

  <rect x="40" y="226" width="210" height="48" rx="6" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="56" y="250" font-size="13" font-weight="bold" fill="#1d4ed8">f3()</text>
  <text x="56" y="266" font-size="12" fill="#b91c1c">抛出异常！</text>

  <line x1="145" y1="146" x2="145" y2="116" stroke="#ef4444" stroke-width="1.5" marker-end="url(#redarrow)"/>
  <line x1="145" y1="226" x2="145" y2="196" stroke="#ef4444" stroke-width="1.5" marker-end="url(#redarrow)"/>
  <text x="155" y="134" font-size="11" fill="#ef4444">异常</text>
  <text x="155" y="214" font-size="11" fill="#ef4444">异常</text>

  <text x="320" y="90" font-size="13" fill="#374151">f3 抛出异常后：</text>
  <text x="320" y="114" font-size="12" fill="#6b7280">先看 f3 自己有没有 catch</text>
  <text x="320" y="136" font-size="12" fill="#6b7280">没有 → 沿调用栈传给 f2</text>
  <text x="320" y="158" font-size="12" fill="#6b7280">f2 也没有 → 传给 f1</text>
  <text x="320" y="180" font-size="12" fill="#047857">f1 有 catch → 接住，处理</text>

  <text x="20" y="290" font-size="12" fill="#6b7280">谁都不接，异常就一路传到最外层，程序通常就异常终止（这就是「未捕获异常」）。</text>
</svg>
