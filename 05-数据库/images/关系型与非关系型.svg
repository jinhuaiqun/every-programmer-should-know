<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="fk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">关系型 vs 非关系型：表格拆开拼关系，还是文档各自装好</text>

  <!-- 左：关系型 -->
  <text x="135" y="64" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">关系型（表 + 外键）</text>

  <!-- 员工表 -->
  <rect x="40" y="76" width="190" height="72" rx="5" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="135" y="94" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">员工表</text>
  <line x1="48" y1="102" x2="222" y2="102" stroke="#3b82f6" stroke-width="0.8"/>
  <line x1="135" y1="102" x2="135" y2="148" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="87" y="118" font-size="11" fill="#6b7280" text-anchor="middle">id</text>
  <text x="182" y="118" font-size="11" fill="#6b7280" text-anchor="middle">姓名</text>
  <text x="87" y="136" font-size="12" font-weight="bold" fill="#e07b00" text-anchor="middle">1</text>
  <text x="182" y="136" font-size="12" fill="#4b5563" text-anchor="middle">张三</text>

  <!-- 外键箭头：订单表.用户id → 员工表.id -->
  <line x1="134" y1="206" x2="87" y2="152" stroke="#e07b00" stroke-width="1.5" marker-end="url(#fk)"/>
  <text x="150" y="182" font-size="11" fill="#e07b00">外键：用户id → id</text>

  <!-- 订单表 -->
  <rect x="40" y="206" width="190" height="72" rx="5" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="135" y="224" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">订单表</text>
  <line x1="48" y1="232" x2="222" y2="232" stroke="#3b82f6" stroke-width="0.8"/>
  <line x1="103" y1="232" x2="103" y2="278" stroke="#3b82f6" stroke-width="0.8"/>
  <line x1="166" y1="232" x2="166" y2="278" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="71" y="248" font-size="11" fill="#6b7280" text-anchor="middle">id</text>
  <text x="134" y="248" font-size="11" fill="#6b7280" text-anchor="middle">用户id</text>
  <text x="198" y="248" font-size="11" fill="#6b7280" text-anchor="middle">金额</text>
  <text x="71" y="266" font-size="12" fill="#4b5563" text-anchor="middle">101</text>
  <text x="134" y="266" font-size="12" font-weight="bold" fill="#e07b00" text-anchor="middle">1</text>
  <text x="198" y="266" font-size="12" fill="#4b5563" text-anchor="middle">99</text>

  <!-- 右：非关系型 -->
  <text x="505" y="64" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">非关系型（以文档库为例）</text>

  <rect x="410" y="76" width="190" height="50" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="505" y="106" font-size="12" fill="#4b5563" text-anchor="middle">{ 姓名: 张三, 订单: 99 }</text>

  <rect x="410" y="142" width="190" height="50" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="505" y="172" font-size="12" fill="#4b5563" text-anchor="middle">{ 姓名: 李四, 订单: 50 }</text>

  <text x="320" y="310" font-size="12" fill="#4b5563" text-anchor="middle">关系型用「表 + 外键」组织数据；非关系型如文档库让数据自包含，另有键值、图等形式</text>
</svg>
