<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d4ed8">事务：一组操作要么全成功，要么全回滚（以转账为例）</text>
  <text x="20" y="52" font-size="12" fill="#4b5563">转账：A 账户转 100 元给 B 账户</text>

  <!-- 成功 -->
  <rect x="60" y="68" width="240" height="130" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="180" y="92" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">✓ 全部成功</text>
  <text x="180" y="116" font-size="12" fill="#4b5563" text-anchor="middle">A 账户：500 → 400</text>
  <text x="180" y="138" font-size="12" fill="#4b5563" text-anchor="middle">B 账户：200 → 300</text>
  <text x="180" y="164" font-size="11" fill="#047857" text-anchor="middle">提交 COMMIT，改动永久生效</text>

  <!-- 失败 -->
  <rect x="340" y="68" width="240" height="130" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="460" y="92" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">✗ 中途出错</text>
  <text x="460" y="116" font-size="12" fill="#4b5563" text-anchor="middle">A 账户：500 → 400 → 500</text>
  <text x="460" y="138" font-size="12" fill="#4b5563" text-anchor="middle">B 账户：200 → 200（没变）</text>
  <text x="460" y="164" font-size="11" fill="#b91c1c" text-anchor="middle">回滚 ROLLBACK，恢复原样</text>

  <text x="320" y="250" font-size="12" fill="#4b5563" text-anchor="middle">第二步出错，第一步也要撤销——这就是原子性（A）：要么都成，要么都不成</text>
</svg>
